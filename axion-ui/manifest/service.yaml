apiVersion: v1
kind: Service
metadata:
  name: axion-ui
spec:
  type: LoadBalancer   # Agar direct UI pod/Ingress se connect ho raha hai
  selector:
    app: axion-ui   # Dhyaan dein: Ye label telemetry deployment ke template labels se match hona chahiye
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80